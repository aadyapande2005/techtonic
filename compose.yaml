services:
  frontend:
    build: ./frontend/social_media_app
    ports:
      - "8080:80"
    env_file:
      - ./frontend/social_media_app/.env
    depends_on:
      - backend

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app/backend
      - /app/backend/node_modules  # Isolate node_modules from the host
    depends_on:
      - redis
      - qdrant

  workers:
    build: ./backend
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app/backend
      - /app/backend/node_modules  # Isolate node_modules from the host
    command: sh -c "npm install && node workers/post.worker.js & node workers/profile.worker.js & node workers/register.worker.js & wait"
    depends_on:
      - backend

  nginx:
    image: nginx:latest
    ports:
      - "3000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend

  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage