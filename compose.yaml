services:
    frontend:
        build: ./frontend/social_media_app
        ports:
            - "8080:80"
        depends_on:
            - backend

    backend:
        build: ./backend
        env_file:
            - ./backend/.env

    workers:
        build: ./backend
        env_file:
            - ./backend/.env
        command: sh -c "node workers/post.worker.js & node workers/profile.worker.js & node workers/register.worker.js & wait"
        depends_on:
            - backend
            - redis
            - qdrant

    nginx:
        image: nginx:latest
        ports:
            - "3000:80"
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf
        depends_on:
            - backend

    redis:
        image: redis:latest
        ports:
            - "6379:6379"

    qdrant:
        image: docker.io/quantumblack/qdrant:latest
        ports:
            - "6333:6333"
            - "6334:6334"
        volumes:
            - qdrant_data:/qdrant/storage

            